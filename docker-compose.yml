services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: influsmart-backend
    restart: unless-stopped
    ports:
      - "3009:3009"
    volumes:
      # Hot reload: solo src se monta; node_modules queda dentro del contenedor
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env:ro
      # Archivos subidos (avatares, entregables) persisten en volumen nombrado
      - backend-uploads:/app/uploads
    environment:
      # Sobreescribe DB_HOST del .env para alcanzar PostgreSQL local desde Docker
      DB_HOST: host.docker.internal
    extra_hosts:
      # Necesario en Linux; en Docker Desktop para Windows ya está disponible
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: influsmart-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Hot reload: src e index.html; node_modules queda en el contenedor
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/.env:/app/.env:ro
    environment:
      # Proxy de Vite apunta al servicio backend dentro de la red Docker
      VITE_PROXY_TARGET: http://backend:3009
    depends_on:
      - backend

volumes:
  backend-uploads:
